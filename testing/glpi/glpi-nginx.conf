# GLPI Nginx configuration file
# This file is used to configure the Nginx server for GLPI.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;

    root /var/www/glpi/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        # the following line needs to be adapted, as it changes depending on OS distributions and PHP versions
        fastcgi_pass unix:/var/run/glpi/glpi-fpm.sock;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include /etc/nginx/fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param GLPI_CONFIG_DIR /var/lib/glpi/config;
        fastcgi_param GLPI_VAR_DIR /var/lib/glpi/files;
        fastcgi_param GLPI_MARKETPLACE_DIR /var/lib/glpi/marketplace;"";
    }

    # deny access to .htaccess/.htpasswd files
    location ~ /\.ht {
        deny all;
    }

}